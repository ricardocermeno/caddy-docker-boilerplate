services:

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/Caddyfile:/etc/caddy/Caddyfile
      - $PWD/.caddy/site:/srv
      - $PWD/.caddy/logs:/var/log
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - accounting-net
      - api-dian-net
      - kafkaui-net
      - ideal-app-net

networks:
  accounting-net:
    name: accountingiac_accounting-net
    external: true
  api-dian-net:
    name: dian-api-iac_api-dian-net
    external: true
  kafkaui-net:
    name: kafka_kafkaui-net
    external: true
  ideal-app-net:
    name: ideal-app-iac_ideal-app-net
    external: true

volumes:
  caddy_data:
  caddy_config: